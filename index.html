html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0 auto;background:var(--bg) repeating-linear-gradient(90deg,transparent 0 58px,rgba(0,0,0,.12) 58px 60px);color:var(--ink);font:15px/1.4 system-ui,sans-serif;max-width:520px;padding:10px 10px 78px;user-select:none;min-height:100vh}
h1,.hd,button,nav{font-family:'Pirata One',Georgia,serif;letter-spacing:.5px}
.card{background:var(--card);border:3px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.35)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:20px}
.gold{color:var(--gold)}
.bar{height:12px;background:var(--bar);border:2px solid var(--line);border-radius:3px;overflow:hidden;margin:4px 0}

.hp i{background:var(--hp)}.ehp i{background:var(--ehp)}.xp i{background:#f5c04a}
canvas{width:100%;display:block;image-rendering:pixelated;border:3px solid #5e3a18;border-radius:6px;background:#000}
.row{display:flex;gap:8px;margin-bottom:8px}
button{font-size:17px;border:2px solid #d9a441;border-radius:8px;padding:10px 6px;background:linear-gradient(#8a5a2b,#5e3a18);color:#fff2cf;text-shadow:0 1px 0 #000;flex:1;cursor:pointer;box-shadow:0 3px 0 #2a1808}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #2a1808}
button.alt{background:linear-gradient(#3f6285,#24384f)}
button.ult{background:linear-gradient(#a0322a,#661a15)}
button:disabled,button.no{opacity:.45}
.log{font-size:13px;color:var(--mut);min-height:86px}.log div:first-child{color:var(--ink);font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:2px dashed var(--line)}
.item:last-child{border:0}.item button{flex:0 0 auto;min-width:96px}.item small{color:var(--mut);display:block}
h3{margin:2px 0 4px;font-size:22px;font-weight:400}
.wanted{text-align:center;border:3px double var(--line);padding:8px;background:rgba(0,0,0,.05)}
.wanted b{font-size:26px;font-weight:400;display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;max-width:520px;margin:0 auto;background:linear-gradient(#6b4423,#3e2712);border-top:3px solid #d9a441;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;box-shadow:none;color:#c9a66b;border-radius:0;padding:8px 2px;font-size:12px;text-shadow:none}
nav button.on{color:#ffd66b}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.ov .card{max-width:380px;text-align:center}
input{font:inherit;font-size:16px;padding:9px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);flex:2;min-width:0;user-select:text}
.hide{display:none}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-120px);background:#3e2712;color:#ffd66b;border:2px solid #d9a441;padding:10px 16px;border-radius:8px;font:20px 'Pirata One',Georgia,serif;transition:transform .3s;z-index:20;text-align:center;max-width:90%}
#toast.show{transform:translate(-50%,0)}

 if(S.style=="sword"){const[d,c]=dmg([1,3,7][k],k==2);say(["🗡️ Slash ","🌀 Grand Slash ","🐉 Dragon Cut "][k]+d+(c?" CRIT!":""));hurt(cur,d,c)}
 else{const n=[2,4,1][k],m=[.6,.9,9][k];let s=[];for(let i=0;i<n&&!cur.dead;i++){const[d,c]=dmg(m);s.push(d);hurt(cur,d,c,140+i*14)}say(["🥊 Punches ","💥 Barrage ","🌋 Titan Smash "][k]+s.join("+"))}
 if(k==1)S.cd=Math.max(2,5-RS('cd')-Math.floor(F().cd));if(k==2)S.cd2=14;
}
function enemyTurn(){
 const d=Math.max(1,Math.floor(E.a*(.85+Math.random()*.3)));S.hp-=d;EA=1;PF=.25;pop(60,"-"+d,'#ff5a4a');
 if(S.style=="fist")S.hp=Math.min(maxHp(),S.hp+Math.ceil(maxHp()*.02));
 if(F().reg)S.hp=Math.min(maxHp(),S.hp+Math.ceil(maxHp()*F().reg));
 if(S.hp<=0){const l=Math.floor(S.gold*.1);S.gold-=l;S.hp=maxHp();say("💀 Defeated! Lost "+l+" gold. Back to full HP.");spawn()}
}
function round(k){
 if(!E||!S.style)return;const cur=E;
 if(k==null)k=S.lv>=15&&S.cd2<=0?2:S.cd<=0?1:0;
 attack(k);
 if(!cur.dead&&S.crew.gun){hurt(cur,Math.max(1,Math.floor(atk()*.12*S.crew.gun)),0,120)}
 if(S.crew.cook)S.hp=Math.min(maxHp(),S.hp+Math.ceil(maxHp()*.008*S.crew.cook));
 if(!cur.dead)enemyTurn();
 if(S.cd>0)S.cd--;if(S.cd2>0)S.cd2--;
 draw();
}
function win(c){
 const ship=1+Math.floor(Math.random()*3),g=Math.floor((5+c.el*3)*(c.boss?3:1)*ship*gm()),x=Math.floor((8+c.el*4)*(c.boss?3:1));
 S.gold+=g;S.xp+=x;S.kills++;S.tk++;S.rp+=(c.boss?5:1)+RS('rp');if(c.boss)S.bs++;
 say("🚢 Looted the ship: <b class='gold'>+"+g+"g</b> (x"+ship+"), +"+x+" XP");
 if(Math.random()<(c.boss?.08:.02)+S.isl*.004+RS('fruit')){
  const W=f=>f.w<=8?f.w*(1+S.isl*.4):f.w;let t=FR.reduce((a,f)=>a+W(f),0)*Math.random(),i=0;for(;i<FR.length;i++){t-=W(FR[i]);if(t<0)break}
  i=Math.min(i,FR.length-1);S.pend=i;say("🍎 <b>Devil Fruit found: "+FR[i].e+" "+FR[i].n+"!</b>");toast("🍎 "+FR[i].n+" ("+rar(FR[i].w)+")! See Build tab");
 }
 while(S.xp>=need()){S.xp-=need();S.lv++;S.hp=maxHp();say("⭐ Level up! Now Lv"+S.lv);toast("⭐ Level "+S.lv+(S.lv==15?" — Ultimate unlocked!":""))}
 spawn();
}
function heal(){const c=healCost();if(S.gold<c||S.hp>=maxHp())return;S.gold-=c;S.hp=Math.min(maxHp(),S.hp+Math.ceil(maxHp()*.4));pop(60,"+HP",'#5aff9a');say("🍺 Drank rum, +HP")}
function turn(){if(!S.style||!S.auto)return;if(S.hp<maxHp()*.3&&S.gold>=healCost())heal();round()}
function draw(){
 $("lv").textContent="Lv "+S.lv+" "+(S.style=="sword"?"🗡️ Swordsman":S.style=="fist"?"🥊 Brawler":"");
 $("gold").textContent="🪙 "+fmt(S.gold)+"  🔬 "+S.rp;$("xpb").style.width=100*S.xp/need()+"%";
 $("info").textContent="ATK "+Math.floor(atk())+" • HP "+maxHp()+" • Crit "+Math.round(crit()*100)+"% • Kills "+S.tk+(S.fruit!=null?" • "+FR[S.fruit].e:"")+(S.fruit2!=null?FR[S.fruit2].e:"");
 $("isl").textContent=ISL[S.isl].e+" "+ISL[S.isl].n+" — boss in "+(10-S.kills%10)+" kills";
 $("php").style.width=Math.max(0,100*S.hp/maxHp())+"%";$("pht").textContent="You "+Math.max(0,Math.ceil(S.hp))+"/"+maxHp();
 if(E){$("ehp").style.width=Math.max(0,100*E.hp/E.mx)+"%";$("eht").textContent=E.n+" "+Math.max(0,Math.ceil(E.hp))+"/"+E.mx}
 $("bSp").textContent=S.cd>0?"⏳ "+S.cd:"✨ Special";$("bSp").classList.toggle("no",S.cd>0);
 $("bUlt").textContent=S.lv<15?"🔒 Lv15":S.cd2>0?"⏳ "+S.cd2:"🔥 Ultimate";$("bUlt").classList.toggle("no",S.lv<15||S.cd2>0);
 $("bHeal").textContent="🍺 Rum "+healCost()+"g";$("bHeal").classList.toggle("no",S.gold<healCost());
 $("bAuto").textContent="Auto: "+(S.auto?"ON":"OFF");
 document.querySelectorAll("[data-cost]").forEach(b=>b.classList.toggle("no",S.gold<+b.dataset.cost));
}
function drawUp(){
 const tr=[["🗡️","Attack","+3 ATK"],["❤️","Vitality","+15 max HP"],["🌀","Style Mastery","+2 ATK"]];
 $("t-up").innerHTML='<h3>Training</h3>'+tr.map((n,k)=>{const c=cost(k);return `<div class="item"><div>${n[0]} ${n[1]}<small>Lv ${S.up[["atk","vit","mas"][k]]} • ${n[2]}</small></div><button data-cost="${c}" data-up="${k}">🪙 ${fmt(c)}</button></div>`}).join("")
 +'<h3 style="margin-top:10px">Your Crew</h3>'+CR.map(c=>{const p=ccost(c);return `<div class="item"><div>${c[1]} ${c[2]}<small>Lv ${S.crew[c[0]]} • ${c[3]}</small></div><button data-cost="${p}" data-cr="${c[0]}">🪙 ${fmt(p)}</button></div>`}).join("");
}
function drawMap(){
 $("t-map").innerHTML="<h3>Sail to an island</h3>"+ISL.map((I,i)=>{const ok=S.lv>=I.req;return `<div class="item"><div>${I.e} ${I.n}${i==S.isl?" ✓":""}<small>${ok?"Enemies Lv "+I.lv+"+ • boss: "+I.boss.n:"🔒 Requires Lv "+I.req}</small></div><button ${ok&&i!=S.isl?"":"disabled"} data-isl="${i}">Sail</button></div>`}).join("");

function drawMe(){
 const slots=S.res.f2?[S.fruit,S.fruit2]:[S.fruit];
 let h='<div class="card"><div class="wanted"><small>WANTED</small><b>☠️ '+fmt(bounty())+' 🪙</b><small>'+S.tk+' ships sunk • '+S.bs+' bosses slain</small></div></div><div class="card"><h3>Devil Fruit</h3>'
 +slots.map((i,k)=>'<div style="margin:6px 0">Slot '+(k+1)+': '+(i!=null?FR[i].e+" <b>"+FR[i].n+"</b> ("+rar(FR[i].w)+") — "+FR[i].d:"empty")+"</div>").join("");
 if(S.pend!=null){const f=FR[S.pend];h+=`<div class="item"><div>${f.e} ${f.n}<small>${rar(f.w)}: ${f.d}</small></div><div>`+slots.map((_,k)=>`<button data-eat="${k+1}" style="margin:2px 0">Eat → slot ${k+1}</button>`).join("")+`</div></div>`}
 else if(S.fruit==null)h+='<small>Beat enemies for a small chance to find one. Later islands drop rarer fruits!</small>';
 h+='</div><div class="card"><h3>Fighting style</h3><div class="item"><div>'+(S.style=="sword"?"🗡️ Swordsman":"🥊 Brawler")+'<small>Switching costs 500 gold, keeps your levels</small></div><button class="alt" data-sw="1" data-cost="500">Switch</button></div></div><div class="card"><button class="alt" data-reset="1">Reset save</button></div>';
 $("t-me").innerHTML=h;
}
document.body.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.s){S.style=d.s;S.hp=maxHp();$("pick").classList.add("hide");spawn();draw();save();return}
 if(d.t){["battle","up","res","map","fl","me"].forEach(t=>$("t-"+t).classList.toggle("hide",t!=d.t));document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x==b));
  if(d.t=="up")drawUp();if(d.t=="res")drawRes();if(d.t=="fl")drawFleet();if(d.t=="map")drawMap();if(d.t=="me")drawMe();return}
 if(d.rs){const n=RES.find(x=>x.id==d.rs);if(n&&!S.res[n.id]&&(!n.pre||S.res[n.pre])&&S.rp>=n.c){S.rp-=n.c;S.res[n.id]=1;toast(n.e+" "+n.n+" researched!");drawRes();draw();save()}return}
 if(d.nm){const v=$("nm").value.trim().slice(0,14);if(v){S.name=v;pushMe();save();toast("Name saved")}return}
 if(d.fc){const nm=$("fin").value.trim(),id=slug(nm);if(id&&FL.ok)DB.doc("fleets/"+id).get().then(x=>{if(!x.exists)return DB.doc("fleets/"+id).set({name:nm,t:Date.now()})}).catch(()=>{}).then(()=>{joinFleet(id);drawFleet()});return}
 if(d.fj){joinFleet(d.fj);drawFleet();return}
 if(d.fl){if(unsub)unsub();unsub=null;try{DB.doc("fleets/"+S.fleet).collection("crew").doc(UID).delete()}catch(e){}S.fleet=null;FL.members=[];FL.n=1;save();drawFleet();draw();return}
 if(d.up!=null){const k=+d.up,c=cost(k);if(S.gold>=c){S.gold-=c;S.up[["atk","vit","mas"][k]]++;if(k==1)S.hp+=15;drawUp();draw();save()}return}
 if(d.cr){const c=CR.find(x=>x[0]==d.cr),p=ccost(c);if(S.gold>=p){S.gold-=p;S.crew[d.cr]++;drawUp();draw();save()}return}
 if(d.isl!=null){S.isl=+d.isl;S.kills=0;spawn();drawMap();draw();say("⛵ Sailed to "+ISL[S.isl].n);save();return}
 if(d.eat){if(d.eat=='2')S.fruit2=S.pend;else S.fruit=S.pend;S.pend=null;S.hp=Math.min(S.hp,maxHp());say("😋 Ate the fruit... awful taste, awesome power!");drawMe();draw();save();return}
 if(d.sw&&S.gold>=500){S.gold-=500;S.style=S.style=="sword"?"fist":"sword";S.hp=Math.min(S.hp,maxHp());drawMe();draw();save();return}
 if(d.reset&&confirm("Delete all progress?")){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
});

/* ---------- pixel renderer ---------- */
const cv=$("cv"),g=cv.getContext("2d");
let T=0,last=0,PA=0,EA=0,PF=0,EF=0,EI=0,FT=[];
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};
function spr(rows,pal,cx,fy,sc,flip,fl){
 const w=Math.max(...rows.map(r=>r.length)),h=rows.length,fw=fl>0&&(T*30|0)%2;
 rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch=='.')continue;
  R(cx-w*sc/2+(flip?w-1-i:i)*sc,fy-h*sc+j*sc,sc,sc,fw?'#fff':pal[ch]||'#f0f')}})}
const DECO={
palm(){const p=(x)=>{for(let i=0;i<9;i++)R(x+(i*i>>4),96-i*6,4,6,'#7a4a1e');const tx=x+5,ty=48;R(tx-14,ty,28,3,'#2a8a3a');R(tx-10,ty-4,20,3,'#3aaa4a');R(tx-19,ty+3,10,3,'#2a8a3a');R(tx+9,ty+3,10,3,'#2a8a3a');R(tx-1,ty+3,3,3,'#5a3a1a')};p(10);p(212)},
rocks(){R(8,84,28,16,'#4a4650');R(14,77,14,9,'#5a5660');R(196,90,30,10,'#4a4650');R(222,52,2,48,'#3a2414');R(224,52,14,9,'#111');R(229,54,4,4,'#fff')},
tower(){R(10,38,32,62,'#8a8a92');for(let i=0;i<4;i++)R(10+i*9,33,6,6,'#8a8a92');R(24,56,6,10,'#222');R(25,14,2,20,'#333');R(27,14,10,6,'#d33');R(200,64,30,36,'#7a7a82');for(let i=0;i<3;i++)R(200+i*11,60,7,5,'#7a7a82')},
volc(){for(let i=0;i<50;i++)R(190-i,50+i,i*2,1,'#3a2a2a');R(185,50,10,4,'#ff7a2a');for(let i=0;i<6;i++)R(186+(i*7)%20,50-((T*20+i*13)%40),2,2,'#ffb04a');R(10,70,20,30,'#2a2020')},
ice(){for(let i=0;i<5;i++){const x=20+i*48,h=30+(i*17%25);for(let j=0;j<h;j++)R(x-((h-j)>>2),100-j,((h-j)>>1)+1,1,i%2?'#bfe4f5':'#e8faff')}},
wreck(){R(20,80,4,20,'#3a2a20');R(10,86,26,3,'#3a2a20');R(24,62,3,22,'#2a1a14');R(190,84,40,12,'#3a2a20');R(200,66,3,20,'#2a1a14');R(0,88,240,10,'rgba(200,255,230,.15)')},
cloud(){[[20,80],[110,90],[180,76]].forEach(([x,y])=>{R(x,y,44,10,'#fff');R(x+8,y-6,28,8,'#fff')});R(100,50,4,40,'#f5c04a');R(92,44,20,8,'#f5c04a');R(97,38,10,6,'#ffe08a')},
gate(){const q=Math.sin(T*2)*.3+.7;g.strokeStyle='rgba(190,90,255,'+q+')';g.lineWidth=5;g.beginPath();g.ellipse(190,72,20,30,0,0,7);g.stroke();g.fillStyle='rgba(90,20,140,.6)';g.beginPath();g.ellipse(190,72,17,27,0,0,7);g.fill();R(20,60,10,40,'#1a0a2a');R(50,74,8,26,'#1a0a2a')},
pill(){[14,46,196].forEach((x,i)=>{R(x,i==2?68:48,8,i==2?32:52,'#d8c8a0');R(x-3,i==2?64:44,14,5,'#eadab0')});R(100,84,40,16,'#c8a84a');R(108,74,24,10,'#f5c04a')}};
function scene(){
 const th=TH[S.isl];
 for(let i=0;i<9;i++)R(0,i*8,240,9,mix(th.s[0],th.s[1],i/8));
 if(th.sun){g.fillStyle=th.sun;g.beginPath();g.arc(195,34,13,0,7);g.fill()}
 for(let i=0;i<3;i++){const x=(T*5+i*95)%300-50,y=14+i*14;R(x,y,34,6,'rgba(255,255,255,.7)');R(x+6,y-4,20,5,'rgba(255,255,255,.7)')}
 R(0,66,240,40,th.sea);
 for(let k=0;k<6;k++)for(let j=0;j<9;j++)R((((j*30+(k%2)*15+T*(k%2?9:-9))%270)+270)%270-15,68+k*6,10,1,'rgba(255,255,255,.35)');
 const sy=60+Math.sin(T*1.5)*1.5;R(120,sy,28,5,'#3a2414');R(133,sy-18,2,18,'#3a2414');R(124,sy-16,9,11,'#eadfc4');R(136,sy-14,8,9,'#eadfc4');
 R(0,100,240,35,th.sand);R(0,98,240,3,'rgba(255,255,255,.55)');R(0,124,240,11,'rgba(0,0,0,.14)');
 DECO[th.d]();
}
function rain(){if(TH[S.isl].sn){g.fillStyle='#fff';for(let i=0;i<40;i++)g.fillRect(((i*29+T*12+Math.sin(T+i)*6)%240)|0,((i*47+T*30)%135)|0,1,1)}if(!TH[S.isl].st)return;g.fillStyle='rgba(200,220,255,.6)';for(let i=0;i<30;i++)g.fillRect(((i*37+T*90)%240)|0,((i*53+T*260)%135)|0,1,4);if(Math.sin(T*1.3)>.985)R(0,0,240,135,'rgba(255,255,255,.5)')}
function drawPlayer(){
 const x=68+Math.sin(Math.PI*PA)*38,y=112+Math.sin(T*3)*1.5;
 R(50,112,36,4,'rgba(0,0,0,.25)');spr(SP.pl,PPAL,x,y,3,false,PF);
 const hx=x+16,hy=y-17;
 if(S.style=='sword'){g.save();g.translate(Math.round(hx),Math.round(hy));g.rotate(-.35+PA*1.9);R(-1,-26,3,26,'#dfe8f0');R(-1,-26,1,26,'#fff');R(-5,-2,11,3,'#f5c04a');R(-1,1,3,4,'#5a3a1a');g.restore()}
 else{const o=PA*10;R(hx-4+o,hy-4,9,9,'#1a1410');R(hx-3+o,hy-3,7,7,'#f0c090')}
}
function drawEnemy(){
 const sc=E.boss?4:3,x=175+EI*70-Math.sin(Math.PI*EA)*30;
 R(x-22,112,44,4,'rgba(0,0,0,.25)');spr(SP[E.d.s],E.d.pal,x,112+Math.sin(T*3+1)*1.5,sc,E.d.s=='pl',EF);
}
function frame(ts){
 const dt=Math.min(.05,(ts-last)/1000);last=ts;T=ts/1000;
 PA=Math.max(0,PA-dt*4);EA=Math.max(0,EA-dt*4);PF=Math.max(0,PF-dt);EF=Math.max(0,EF-dt);EI=Math.max(0,EI-dt*2);
 scene();if(S.style){drawPlayer();if(E)drawEnemy()}rain();
 FT=FT.filter(f=>(f.l-=dt)>0);
 FT.forEach(f=>{const y=f.y-(1-f.l)*24;g.globalAlpha=Math.min(1,f.l*2);g.font=(f.big?'bold 14px':'bold 10px')+' monospace';g.fillStyle='#000';g.fillText(f.t,f.x+1,y+1);g.fillStyle=f.c;g.fillText(f.t,f.x,y)});
 g.globalAlpha=1;requestAnimationFrame(frame);
}
